
events {}

http {
    log_format fail2ban '$remote_addr - $remote_user [$time_local] '
                        '"$request" $status $body_bytes_sent';

    access_log /var/log/nginx/access.log fail2ban;
    error_log /var/log/nginx/error.log;

    # Máximo de 5 solicitudes por segundo por IP
    limit_req_zone $binary_remote_addr zone=backend_limit:10m rate=5r/s;

    # Responder con 429 cuando se supere el límite
    limit_req_status 429;

    server {
        listen 3001;

        location / {
            limit_req zone=backend_limit burst=10 nodelay;

            proxy_pass http://127.0.0.1:3002;

            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        }
    }
}

